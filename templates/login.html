<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surfitos - Iniciar Sesión</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'SurfApp/css/login-styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="login-wrapper">
        <div class="login-container">
            <div class="brand-header">
                <div class="brand-badge">
                    <i class="fas fa-water"></i>
                </div>
                <h1>Surfitos</h1>
                <p>Previsión de olas y condiciones del mar</p>
            </div>

            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p class="error-message">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Usuario" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                </div>
                <button type="submit">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>

            <div class="guest-divider"><span>o</span></div>

            <form method="POST" class="guest-form">
                {% csrf_token %}
                <input type="hidden" name="action" value="guest">
                <button type="submit" class="btn-guest">
                    <i class="fas fa-eye"></i> Entrar como invitado (solo lectura)
                </button>
            </form>
        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-content">
            <span>Creado por <strong>XDavider</strong> · Proyecto Surfitos</span>
            <div class="social-links">
                <a class="social-link" href="https://github.com/XDavider/Surfitos" target="_blank" rel="noopener noreferrer" aria-label="Repositorio en GitHub" title="Repositorio en GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a class="social-link" href="#" aria-label="LinkedIn" title="LinkedIn (pendiente de enlace)">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a class="social-link" href="#" aria-label="Instagram" title="Instagram (pendiente de enlace)">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
