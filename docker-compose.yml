version: '3.9'

services:
  web:
    build: .
    command: gunicorn Surfitos.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - /home/xdavider/Surfitos:/app
    ports:
      - "8001:8000"
    env_file:
      - /home/xdavider/Surfitos/.env
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:

